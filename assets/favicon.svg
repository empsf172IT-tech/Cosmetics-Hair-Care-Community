<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Espresso Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1F1B" />
      <stop offset="50%" stop-color="#241916" />
      <stop offset="100%" stop-color="#140D0B" />
    </linearGradient>

    <!-- Luxury Rose Gold / Champagne Gradient -->
    <linearGradient id="strandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F7EFE6" />
      <stop offset="60%" stop-color="#E9D8C5" />
      <stop offset="88%" stop-color="#CA7D76" />
      <stop offset="100%" stop-color="#B86F68" />
    </linearGradient>

    <!-- Soft Glow -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#B86F68" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#B86F68" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="32" cy="32" r="31" fill="url(#ringGlow)" />

  <!-- Espresso Circular Base -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGrad)" stroke="#B86F68" stroke-width="2.2" />

  <!-- Delicate Concentric Ring -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#E9D8C5" stroke-opacity="0.28" stroke-width="0.8" />

  <!-- Signature STRANDÉ Double Intertwined Hair Ribbon Emblem -->
  <!-- Scaled precisely from brand SVG: M7 4c5 2 6 7 4 10s-5 4-2 7 m8-17c-5 2-6 7-4 10s5 4 2 7 -->
  <g transform="translate(32, 32) scale(2.0) translate(-12, -12)" fill="none" stroke="url(#strandGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 4c5 2 6 7 4 10s-5 4-2 7" />
    <path d="M15 4c-5 2-6 7-4 10s5 4 2 7" opacity="0.95" />
  </g>

  <!-- Center Micro Glow Node -->
  <circle cx="32" cy="32" r="1.5" fill="#FFFFFF" opacity="0.9" />
</svg>
